<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Seed test</title></head>
<body><pre id="o">seeding...</pre>
<script>
const CFG={cloudName:'dppt775qk',uploadPreset:'gallery_unsigned'};
const COLORS=[['#f9a8d4','#f472b6'],['#c4b5fd','#8b5cf6'],['#fde68a','#f59e0b'],['#a7f3d0','#10b981'],['#bfdbfe','#3b82f6'],['#fecaca','#ef4444']];
function makeCanvas(i){
  const c=document.createElement('canvas');c.width=800;c.height=600;
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,800,600);
  g.addColorStop(0,COLORS[i%COLORS.length][0]);
  g.addColorStop(1,COLORS[i%COLORS.length][1]);
  x.fillStyle=g;x.fillRect(0,0,800,600);
  x.fillStyle='rgba(255,255,255,.85)';
  x.font='bold 64px sans-serif';
  x.textAlign='center';
  x.fillText('#'+(i+1),400,330);
  return new Promise(r=>c.toBlob(r,'image/jpeg',0.9));
}
async function up(blob,name,gid,note,album,date){
  const fd=new FormData();
  fd.append('file',blob,name);
  fd.append('upload_preset',CFG.uploadPreset);
  fd.append('folder','lovegallery');
  fd.append('tags','lovegallery');
  fd.append('context','note='+note+'|date='+date+'|album='+album+'|gid='+gid);
  const r=await fetch('https://api.cloudinary.com/v1_1/'+CFG.cloudName+'/image/upload',{method:'POST',body:fd});
  const j=await r.json();
  return j.public_id;
}
(async()=>{
  const log=[];
  // Nhom 1: 4 anh cung upload
  const g1='gseed001';
  for(let i=0;i<4;i++){
    const b=await makeCanvas(i);
    log.push(await up(b,'seed1_'+(i+1)+'.jpg',g1,'Khoảnh khắc '+i,'Hội An','2026-11-20'));
  }
  // Nhom 2: 2 anh
  const g2='gseed002';
  for(let i=0;i<2;i++){
    const b=await makeCanvas(i+4);
    log.push(await up(b,'seed2_'+(i+1)+'.jpg',g2,'Buổi hẹn '+i,'Kỷ niệm','2026-11-22'));
  }
  // Nhom 3: 1 anh
  const g3='gseed003';
  const b3=await makeCanvas(5);
  log.push(await up(b3,'seed3_1.jpg',g3,'Một mình','Ngày đặc biệt','2026-11-23'));

  document.getElementById('o').textContent='DONE\n'+log.join('\n');
})();
</script></body></html>
